<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Farhan" />
  <meta name="author" content="Farhan">
  <meta name="theme-color" content="#030305" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Social share preview (scrapers don't run JS, so these are static).
       __SITE_URL__ is replaced at build time from VITE_SITE_URL. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Farhan Portfolio" />
  <meta property="og:title" content="Farhan — Full Stack Developer" />
  <meta property="og:description" content="Portfolio of Farhan, a Full Stack Developer working across frontend, backend and DevOps." />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:image" content="__SITE_URL__/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Farhan — Full Stack Developer" />
  <meta name="twitter:description" content="Portfolio of Farhan, a Full Stack Developer working across frontend, backend and DevOps." />
  <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <title>Farhan — Full Stack Developer</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <noscript>Your browser does not support JavaScript!</noscript>

</body>

</html>
